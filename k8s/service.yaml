apiVersion: v1
kind: Service
metadata:
  name: devops-demo
  namespace: devops-demo
  labels:
    app: devops-demo
spec:
  # OrbStack gives LoadBalancer services a reachable address automatically,
  # so no port-forward is needed.
  type: LoadBalancer
  selector:
    app: devops-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
